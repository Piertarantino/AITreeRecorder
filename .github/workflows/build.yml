name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build e installer
        shell: pwsh
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.4.1' }}
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: selftest.txt

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app e DMG
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.4.1' }}
        run: zsh packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.os }}
          path: dist/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest-${{ matrix.os }}
          path: selftest.txt

  release:
    # Release con un tag vX.Y.Z, oppure con "[release vX.Y.Z]" nel messaggio del commit su main
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: ver
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT";
          else echo "tag=$(grep -o '\[release v[0-9.]*' <<< "$MSG" | head -1 | cut -c10-)" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AI Tree Recorder ${{ steps.ver.outputs.tag }}
          make_latest: true
          body: |
            Scarica il file per il tuo computer:
            - **Windows 10/11**: `AI-Tree-Recorder-Setup-*.exe`
            - **Mac con chip Apple (M1-M4)**: `*-Mac-Apple-Silicon.dmg`
            - **Mac Intel**: `*-Mac-Intel.dmg`

            **Mac, primo avvio:** macOS dice "AI Tree Recorder non è stata aperta". Premi **Fine**, poi Impostazioni di Sistema → Privacy e sicurezza → **Apri comunque** (in fondo alla pagina). Oppure nel Terminale: `xattr -dr com.apple.quarantine "/Applications/AI Tree Recorder.app"`

            **Windows, primo avvio:** se compare "Windows ha protetto il PC", premi **Ulteriori informazioni → Esegui comunque**.

            Istruzioni di installazione nel [README](https://github.com/${{ github.repository }}#scarica).
          files: |
            out/windows-installer/*.exe
            out/mac-*/*.dmg
            docs/AI-Tree-Recorder-presentazione.pdf

name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build e installer
        shell: pwsh
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.4.0' }}
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: selftest.txt

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app e DMG
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.4.0' }}
        run: zsh packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.os }}
          path: dist/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest-${{ matrix.os }}
          path: selftest.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows-installer/*.exe
            out/mac-*/*.dmg
